<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zona de Combate</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- MENÚ PRINCIPAL -->
    <!-- ========================= -->

    <div id="menu">

        <h1>🎯 ZONA DE COMBATE</h1>

        <p>WASD para moverte</p>
        <p>Mouse para apuntar y disparar</p>
        <p>ESC para pausar</p>

        <button onclick="iniciarJuego()">
            ▶️ JUGAR
        </button>

    </div>


    <!-- ========================= -->
    <!-- CANVAS DEL JUEGO -->
    <!-- ========================= -->

    <canvas id="game"></canvas>


    <!-- ========================= -->
    <!-- INFORMACIÓN DEL JUGADOR -->
    <!-- ========================= -->

    <div id="hud">

        ❤️ Vida:
        <span id="vida">100</span>

        &nbsp;&nbsp;&nbsp;

        🎯 Puntos:
        <span id="puntos">0</span>

    </div>


    <!-- ========================= -->
    <!-- MENÚ DE PAUSA -->
    <!-- ========================= -->

    <div id="pausa">

        <div class="panel-pausa">

            <h1>⏸️ PAUSA</h1>

            <button onclick="continuarJuego()">
                ▶️ CONTINUAR
            </button>

            <button onclick="iniciarJuego()">
                🔄 REINICIAR
            </button>

            <button onclick="volverAlMenu()">
                🏠 MENÚ PRINCIPAL
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- GAME OVER -->
    <!-- ========================= -->

    <div id="gameOver">

        <h1>💀 GAME OVER</h1>

        <p>
            Puntuación:
            <span id="puntuacionFinal">0</span>
        </p>

        <button onclick="iniciarJuego()">
            🔄 VOLVER A JUGAR
        </button>

        <button onclick="volverAlMenu()">
            🏠 MENÚ
        </button>

    </div>


    <script src="game.js"></script>

</body>
</html>
